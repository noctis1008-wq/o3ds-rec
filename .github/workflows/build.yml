name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-numpy
      - run: bash test/run_test.sh && PACK=1 bash test/run_test.sh && RGB565=1 bash test/run_test.sh && HASH=1 RGB565=1 SPLIT=1 bash test/run_test.sh
  sdbench:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C tools/sdbench
      - uses: actions/upload-artifact@v4
        with:
          name: sdbench-3dsx
          path: tools/sdbench/sdbench.3dsx
  release:
    # main への push ごとに Release を公開し sdbench.3dsx を添付する。
    # Checkpoint の c_github_downloader.c は
    #   https://github.com/noctis1008-wq/o3ds-rec/releases/latest/download/sdbench.3dsx
    # から取得する。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [host-test, sdbench]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdbench-3dsx
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: o3ds-rec SD bench (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: sdbench.3dsx
          body: |
            旧3DS用 SD書き込みベンチ。sdbench.3dsx を SD の /3ds/ に置き、Homebrew Launcher から起動。
            結果は sd:/o3ds-rec/bench_result.txt に保存される。
            Checkpoint の GitHub ダウンローダー（c_github_downloader.c）のプリセットからも取得できる。
