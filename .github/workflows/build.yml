name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-numpy
      - run: bash test/run_test.sh && PACK=1 bash test/run_test.sh
  sdbench:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C tools/sdbench
      - uses: actions/upload-artifact@v4
        with:
          name: sdbench-3dsx
          path: tools/sdbench/sdbench.3dsx
  release:
    # v で始まるタグを push すると GitHub Releases に sdbench.3dsx を公開する
    # （3DS の GitHub ダウンローダーや Universal-Updater は Releases から取得するため）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-test, sdbench]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdbench-3dsx
      - uses: softprops/action-gh-release@v2
        with:
          files: sdbench.3dsx
          generate_release_notes: true
